name: PAIOS example
on:
  pull_request:
    paths: ['examples/paios/**', '.github/workflows/paios-example.yml']
  push:
    branches: [main]
    paths: ['examples/paios/**', '.github/workflows/paios-example.yml']
  workflow_dispatch:

concurrency:
  group: paios-example-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-test
        run: bash examples/paios/System/Scripts/selftest.sh

      - name: Install from the checkout
        run: |
          set -euo pipefail
          vault=$(mktemp -d)
          echo "vault=$vault" >> "$GITHUB_ENV"
          bash examples/paios/install.sh --tz UTC "$vault" | tee "$vault/out.txt"
          grep -q 'SELFTEST PASS' "$vault/out.txt"
          test -f "$vault/PAIOS/AGENTS.md"
          test ! -e "$vault/PAIOS/install.sh"
          want=$(cd "$vault" && pwd -P)
          ( set +u; unset PAIOS_VAULT PAIOS_TZ; . "$vault/PAIOS/paios.env"
            [ "$PAIOS_VAULT" = "$want" ] && [ "$PAIOS_TZ" = "UTC" ] )

      - name: Refuse an existing PAIOS folder
        run: |
          set -euo pipefail
          listing() { (cd "$vault/PAIOS" && find . | sort && find . -type f -exec cksum {} + | sort); }
          before=$(listing)
          rc=0; out=$(bash examples/paios/install.sh --tz UTC "$vault" 2>&1) || rc=$?
          echo "$out"
          [ "$rc" -eq 1 ]
          grep -q 'Refusing' <<<"$out"
          [ "$before" = "$(listing)" ]
          rc=0; bash examples/paios/install.sh --force "$vault" || rc=$?
          [ "$rc" -eq 2 ]
          [ "$before" = "$(listing)" ]

      - name: No vault path and no terminal
        run: |
          set -euo pipefail
          rc=0; bash examples/paios/install.sh </dev/null || rc=$?
          [ "$rc" -eq 2 ]

      - name: Path with spaces, a quote and a dollar sign
        run: |
          set -euo pipefail
          base2=$(mktemp -d)
          echo "base2=$base2" >> "$GITHUB_ENV"
          vault2="$base2/my vault's \$dir"
          mkdir "$vault2"
          bash examples/paios/install.sh --tz UTC "$vault2" | tee "$base2/out.txt"
          grep -q 'SELFTEST PASS' "$base2/out.txt"
          want=$(cd "$vault2" && pwd -P)
          ( set +u; unset PAIOS_VAULT PAIOS_TZ; . "$vault2/PAIOS/paios.env"
            [ "$PAIOS_VAULT" = "$want" ] && [ "$PAIOS_TZ" = "UTC" ] )

      - name: One-liner against this commit
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -euo pipefail
          vault3=$(mktemp -d)
          echo "vault3=$vault3" >> "$GITHUB_ENV"
          curl -fsSL "https://raw.githubusercontent.com/$REPO/$SHA/examples/paios/install.sh" \
            | PAIOS_REPO="$REPO" PAIOS_REF="$SHA" bash -s -- --tz UTC "$vault3" | tee "$vault3/out.txt"
          grep -q 'SELFTEST PASS' "$vault3/out.txt"
          grep -q "Fetched $REPO@$SHA" "$vault3/out.txt"
          test -f "$vault3/PAIOS/AGENTS.md"
          test ! -e "$vault3/PAIOS/install.sh"

      - name: Clean up
        if: always()
        run: |
          for d in "${vault:-}" "${base2:-}" "${vault3:-}"; do
            if [ -n "$d" ]; then rm -rf "$d"; fi
          done
