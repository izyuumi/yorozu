name: Release iOS
# A push to main that touches the iPhone and iPad app uploads a build to App Store Connect; TestFlight gives it to the
# internal group, the iOS beta (OWNER_DECISIONS.md, Platform and release). The App Store release stays by hand. The
# plugin rides only in the Mac app, so plugin changes upload nothing here. No tests run; pull requests get a compile
# check (checks.yml).
# Secrets: MAC_CERT_P12 and MAC_CERT_PASSWORD (despite the name, the Apple Distribution identity the iOS export signs
# with), ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (App Store Connect API key, base64 .p8).
on:
  push:
    branches: [main]
    paths: ['apps/ios/**', 'packages/**', 'version.txt', 'scripts/upload_ios.sh', 'scripts/build-number.sh']
  workflow_dispatch:

concurrency:
  group: release-ios
  cancel-in-progress: false
permissions: {}

jobs:
  upload:
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with: { xcode-version: '27.1' } # the owner's Xcode; the iOS 27 SDK is only on the xcode-27 image (public preview)
      - name: Install Tuist 4.209.0
        run: |
          command -v mise >/dev/null || brew install mise
          mise use -g tuist@4.209.0
          mise bin-paths tuist@4.209.0 >> "$GITHUB_PATH"

      # Secrets go only to $RUNNER_TEMP and a keychain of this job's own. Never `set -x` here.
      - name: Signing identity and App Store Connect key
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -eu
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MAC_CERT_P12" | base64 -d > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/distribution.p12"
          # A fresh runner lacks Apple's intermediate, without which codesign won't use the identity. It is public.
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -t cert -k "$KEYCHAIN" 2>&1 | grep -v 'already exists' || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          umask 077
          printf '%s' "$ASC_KEY_P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload the iOS build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: scripts/upload_ios.sh --confirm
      - name: Forget signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
