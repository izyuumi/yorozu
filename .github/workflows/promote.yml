name: Promote
on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release-mac
  cancel-in-progress: false
permissions: {}

jobs:
  promote:
    # Merging the release PR (scripts/release_pr.sh) makes the beta it names stable.
    if: github.event.pull_request.merged && github.event.pull_request.head.ref == 'release'
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # The release PR names the beta by build, source commit and DMG digest; --promote refuses a beta that
      # no longer matches all three. Block scalar: the ": " in the sed patterns breaks a plain YAML scalar.
      - run: |
          line() { printf '%s\n' "$BODY" | tr -d '\r' | sed -n "s/^$1: *\([^ ]*\).*/\1/p" | tail -1; }
          scripts/release_mac.sh --promote "$(line Release-Build)" "$(line Release-Commit)" "$(line Release-Digest)"
