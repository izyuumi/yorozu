name: Promote
on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release-mac
  cancel-in-progress: false
permissions: {}

jobs:
  promote:
    # Merging the release PR (scripts/release_pr.sh) makes the beta it names stable.
    if: github.event.pull_request.merged && github.event.pull_request.head.ref == 'release'
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # Block scalar: the ": " in the sed pattern breaks a plain YAML scalar.
      - run: |
          scripts/release_mac.sh --promote "$(printf '%s\n' "$BODY" | sed -n 's/^Release-Build: *\([0-9]*\).*/\1/p' | tail -1)"
