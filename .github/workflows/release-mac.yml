name: Release Mac
# A push to main that touches the Mac app publishes a beta: the prerelease v<version>-beta.<build>, which Macs with beta
# updates on install (yorozu.yumi.to/beta/appcast.xml). A push that changes version.txt first promotes the old version's
# last beta, unchanged, to the stable v<old version>, which every Mac installs (OWNER_DECISIONS.md, Platform and
# release). No tests run here; pull requests get a compile check (checks.yml).
# Secrets: DEVELOPER_ID_P12 and DEVELOPER_ID_PASSWORD (Developer ID Application), ASC_KEY_ID, ASC_ISSUER_ID and
# ASC_KEY_P8 (App Store Connect API key, base64 .p8, for notarization), SPARKLE_ED_KEY (Sparkle's private EdDSA key,
# `generate_keys -x`).
on:
  push:
    branches: [main]
    # The website and relay deploy on their own (deploy-web.yml, deploy-relay.yml).
    paths: ['apps/**', '!apps/web/**', '!apps/relay/**', 'packages/**', 'plugins/**', 'scripts/**', 'version.txt']
  workflow_dispatch:

concurrency:
  group: release-mac
  cancel-in-progress: false
permissions: {}

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before the new version's first beta, so stable and beta never point at the same version.
      - name: Promote the old version's last beta
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          git fetch --depth=1 origin "$BEFORE" 2>/dev/null || { echo "No previous commit to compare"; exit 0; }
          old=$(git show "$BEFORE:version.txt" | tr -d '[:space:]')
          [ "$old" = "$(tr -d '[:space:]' < version.txt)" ] || scripts/release_mac.sh --promote "$old"

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with: { xcode-version: '27.1' } # the owner's Xcode; the iOS 27 SDK is only on the xcode-27 image (public preview)
      - name: Install Tuist 4.209.0
        run: |
          command -v mise >/dev/null || brew install mise
          mise use -g tuist@4.209.0
          mise bin-paths tuist@4.209.0 >> "$GITHUB_PATH"

      # Secrets go only to $RUNNER_TEMP and a keychain of this job's own. Never `set -x` here.
      - name: Signing identity, notary profile and Sparkle key
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          set -eu
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$DEVELOPER_ID_P12" | base64 -d > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$DEVELOPER_ID_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/developer-id.p12"
          # A fresh runner lacks Apple's intermediate, without which codesign won't use the identity. It is public.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -t cert -k "$KEYCHAIN" 2>&1 | grep -v 'already exists' || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "DEVELOPER_ID_P12 holds no Developer ID Application identity" >&2; exit 1; }
          umask 077
          printf '%s' "$ASC_KEY_P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials yorozu-notary \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
          printf '%s' "$SPARKLE_ED_KEY" > "$RUNNER_TEMP/sparkle.key"

      - name: Build, notarize and publish the Mac beta
        env:
          SPARKLE_ED_KEY_FILE: ${{ runner.temp }}/sparkle.key
        run: scripts/release_mac.sh --publish
      - name: Forget signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/sparkle.key" "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
