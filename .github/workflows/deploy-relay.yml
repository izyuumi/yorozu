name: Deploy relay
on:
  push:
    branches: [main]
    # Only relay changes deploy; a dependency bump that touches the relay edits its package.json.
    paths: ['apps/relay/**']
  workflow_dispatch:

# Deploys run in push order; a newer one never cancels a deploy midway.
concurrency:
  group: deploy-relay
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @yorozu/relay
      # Typecheck and tests first: every client, stable and beta, uses relay.yumi.to the moment it deploys.
      - run: pnpm --filter @yorozu/relay test
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @yorozu/relay exec wrangler deploy
