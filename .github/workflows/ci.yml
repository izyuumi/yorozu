name: CI
on: [push, pull_request]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build --package-path packages/shared-swift
      - run: swift test --package-path packages/shared-swift
      - run: swift build --package-path apps/mac

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The Xcode project is generated, not checked in; see apps/ios/Project.swift.
      - run: brew install --cask tuist
      - run: tuist generate --no-open --path apps/ios
      - run: |
          xcodebuild build \
            -workspace apps/ios/Yorozu.xcworkspace \
            -scheme YorozuIOS \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
