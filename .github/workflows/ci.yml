name: CI
on:
  push:
    branches: [main, 'release/*']
  pull_request:

# One run per ref: a newer push cancels the one it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GitHub-hosted runners only: this repo is public, and a self-hosted runner would run any fork's
# pull request on the maintainer's Mac.

# The token needs only to check out; nothing here writes back to GitHub.
permissions:
  contents: read

jobs:
  # Pull requests run only the jobs their paths can break; a job skipped here passes required
  # checks. Pushes to main and release branches, and edits to this file, run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.paths.outputs.ts }}
      relay: ${{ steps.paths.outputs.relay }}
      swift: ${{ steps.paths.outputs.swift }}
      ios: ${{ steps.paths.outputs.ios }}
      web: ${{ steps.paths.outputs.web }}
    steps:
      # Depth 2 holds the pull request's merge commit and the base it merges into.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 2 }
      - id: paths
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(git diff --no-renames --name-only HEAD^1 HEAD)
          else
            files=.github/workflows/ci.yml
          fi
          printf '%s\n' "$files"
          flag() {
            if grep -qE "$2|^\.github/workflows/ci\.yml$" <<<"$files"; then echo "$1=true"; else echo "$1=false"; fi
          }
          build='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.base\.json)$'
          {
            flag ts "^(apps/relay|packages/runtime|packages/shared)/|^fixtures/swift-vectors\.json$|^apps/mac/Sources/YorozuNative/Apple\.swift$|^catalog/models\.json$|$build"
            flag relay '^apps/relay/|^tsconfig\.base\.json$'
            # Interop suites read vectors from fixtures/; wire tests run relay and sidecar.
            flag swift "^(packages/shared-swift|packages/shared|packages/runtime|apps/relay|apps/mac)/|^fixtures/ts-vectors\.json$|$build"
            flag ios '^(apps/ios|packages/shared-swift)/|^version\.txt$'
            flag web '^apps/web/'
          } >> "$GITHUB_OUTPUT"

  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install workflow and shell linters
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Lint workflows and release scripts
        run: |
          "$(go env GOPATH)/bin/actionlint"
          shellcheck scripts/release.sh scripts/appcast.sh scripts/build-version.sh scripts/build-mac.sh scripts/build-ios.sh scripts/dev-bundle.sh
      - name: Check publication success and failure paths
        run: |
          python3 scripts/test-release.py
          python3 scripts/test-release-notes.py
          python3 scripts/test-build-version.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Verify App Store candidate checks without credentials
        run: node --test scripts/asc-candidate.test.mjs

  relay-image:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the locked relay image
        run: docker build -f apps/relay/Dockerfile -t yorozu-relay:ci .
      - name: Check the packaged relay accepts a WebSocket connection
        run: |
          docker run --rm --entrypoint node yorozu-relay:ci --input-type=module -e '
            import assert from "node:assert/strict";
            import { once } from "node:events";
            import WebSocket from "ws";
            import { startRelay } from "./dist/index.js";
            const timeout = setTimeout(() => { console.error("relay smoke timed out"); process.exit(1); }, 10000);
            const relay = await startRelay(0);
            try {
              const ws = new WebSocket(`ws://127.0.0.1:${relay.port}`);
              const [data] = await once(ws, "message");
              const { nonce } = JSON.parse(data.toString());
              assert.equal(typeof nonce, "string");
              assert.ok(nonce.length > 0);
              ws.close();
              await once(ws, "close");
            } finally {
              await relay.close();
              clearTimeout(timeout);
            }
          '

  # The website tests import only Node built-ins, so they need neither macOS nor pnpm.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Test website interactions
        run: node --test apps/web/tests/*.test.mjs

  # One macOS runner for the TypeScript workspaces and the Swift packages: both need the same
  # install and build, and each runner boot costs more than the steps a pull request skips.
  macos:
    needs: changes
    if: needs.changes.outputs.ts == 'true' || needs.changes.outputs.swift == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Swift wire tests run the phone client against the relay and sidecar built here.
      - run: pnpm -r build
      - if: needs.changes.outputs.ts == 'true'
        run: pnpm -r test
      # The hosted image's default Xcode can lag; this project needs the newest stable.
      - if: needs.changes.outputs.swift == 'true'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with: { xcode-version: latest-stable }
      # `swift test` already builds this package; a separate build compiled it twice.
      - if: needs.changes.outputs.swift == 'true'
        run: env -u SDKROOT swift test --package-path packages/shared-swift
      - if: needs.changes.outputs.swift == 'true'
        run: env -u SDKROOT swift test --package-path apps/mac

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    # Compile only. The UI tests (scheme YorozuUITests) took twenty minutes of
    # simulator boot and install on the hosted VM for two minutes of tests, and one starved VM
    # in ten failed it; it runs locally, on a booted simulator with the hardware keyboard off:
    #   env -u SDKROOT xcodebuild test -workspace apps/ios/Yorozu.xcworkspace \
    #     -scheme YorozuUITests -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
    #     CODE_SIGNING_ALLOWED=NO
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The hosted image's default Xcode can lag; this project needs the newest stable.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with: { xcode-version: latest-stable }
      # The Xcode project is generated, not checked in; see apps/ios/Project.swift.
      # Homebrew has no versioned Tuist cask; use the same mise pin as TestFlight.
      - name: Install Tuist 4.209.0
        env:
          # mise's aqua backend reads GitHub's releases API; the token keeps shared runner
          # IPs clear of the anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          command -v mise >/dev/null || brew install mise
          mise use -g tuist@4.209.0
          mise bin-paths tuist@4.209.0 >> "$GITHUB_PATH"
      - run: tuist generate --no-open --path apps/ios
      - run: |
          xcodebuild build \
            -workspace apps/ios/Yorozu.xcworkspace \
            -scheme YorozuIOS \
            -skipPackagePluginValidation \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO
