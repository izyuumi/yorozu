name: CI
on:
  push:
    branches: [main, 'release/*', v0.6.0-alpha, integration-0.6-worker, harness-plugins]
  pull_request:

# One run per ref: a newer push cancels the one it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GitHub-hosted runners only: this repo is public, and a self-hosted runner would run any fork's
# pull request on the maintainer's Mac.

# The token needs only to check out; nothing here writes back to GitHub.
permissions:
  contents: read

jobs:
  # Pull requests run only the jobs their paths can break; a job skipped here passes required
  # checks. The isolated secretary candidate has its own assembled-runtime checks.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.paths.outputs.ts }}
      relay: ${{ steps.paths.outputs.relay }}
      swift: ${{ steps.paths.outputs.swift }}
      ios: ${{ steps.paths.outputs.ios }}
      web: ${{ steps.paths.outputs.web }}
      internal: ${{ github.base_ref == 'v0.6.0-alpha' || github.ref == 'refs/heads/v0.6.0-alpha' || github.ref == 'refs/heads/integration-0.6-worker' || github.ref == 'refs/heads/harness-plugins' }}
    steps:
      # Depth 2 holds the pull request's merge commit and the base it merges into.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 2 }
      - id: paths
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(git diff --no-renames --name-only HEAD^1 HEAD)
          else
            files=.github/workflows/ci.yml
          fi
          printf '%s\n' "$files"
          flag() {
            if grep -qE "$2|^\.github/workflows/ci\.yml$" <<<"$files"; then echo "$1=true"; else echo "$1=false"; fi
          }
          build='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.base\.json|scripts/build-host-core\.sh)$|^packages/host-core/'
          {
            flag ts "^(apps/relay|packages/runtime|packages/shared|packages/openclaw-channel)/|^fixtures/swift-vectors\.json$|^apps/mac/Sources/YorozuNative/Apple\.swift$|^catalog/models\.json$|$build"
            flag relay '^apps/relay/|^tsconfig\.base\.json$'
            # Interop suites read vectors from fixtures/; wire tests run relay and sidecar.
            flag swift "^(packages/shared-swift|packages/shared|packages/runtime|apps/relay|apps/mac)/|^fixtures/ts-vectors\.json$|^scripts/check-mac-multi-host\.(sh|swift)$|$build"
            flag ios '^(apps/ios|packages/shared-swift)/|^version\.txt$'
            flag web "^apps/web/|$build"
          } >> "$GITHUB_OUTPUT"

  rust-host:
    needs: changes
    if: needs.changes.outputs.internal != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the tested Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy
      - name: Check Rust formatting
        run: cargo +1.92.0 fmt --manifest-path packages/host-core/Cargo.toml --check
      - name: Lint the portable core
        run: cargo +1.92.0 clippy --locked --manifest-path packages/host-core/Cargo.toml --all-targets -- -D warnings
      - name: Test persistence and process recovery
        run: cargo +1.92.0 test --locked --manifest-path packages/host-core/Cargo.toml

  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install workflow and shell linters
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Lint workflows and release scripts
        run: |
          "$(go env GOPATH)/bin/actionlint"
          shellcheck scripts/release.sh scripts/appcast.sh scripts/build-version.sh scripts/build-mac.sh scripts/build-ios.sh scripts/dev-bundle.sh scripts/check-internal-alpha.sh scripts/build-internal-alpha.sh
      - name: Check publication success and failure paths
        run: |
          python3 scripts/test-release.py
          python3 scripts/test-release-notes.py
          python3 scripts/test-build-version.py
          python3 scripts/test-stage-internal-alpha.py
          python3 scripts/test-internal-release-policy.py
          python3 scripts/test-intake-hermes-runtime.py
          python3 scripts/test-publish-internal-beta.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Verify App Store candidate checks without credentials
        run: |
          node --test scripts/asc-candidate.test.mjs scripts/asc-alpha-audit.test.mjs scripts/asc-internal.test.mjs
          python3 scripts/test-build-ios.py
      - name: Verify English and Japanese catalogs
        run: node scripts/check-localizations.mjs

  relay-image:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the locked relay image
        run: docker build -f apps/relay/Dockerfile -t yorozu-relay:ci .
      - name: Check the packaged relay accepts a WebSocket connection
        run: |
          docker run --rm --entrypoint node yorozu-relay:ci --input-type=module -e '
            import assert from "node:assert/strict";
            import { once } from "node:events";
            import WebSocket from "ws";
            import { startRelay } from "./dist/index.js";
            const timeout = setTimeout(() => { console.error("relay smoke timed out"); process.exit(1); }, 10000);
            const relay = await startRelay(0);
            try {
              const ws = new WebSocket(`ws://127.0.0.1:${relay.port}`);
              const [data] = await once(ws, "message");
              const { nonce } = JSON.parse(data.toString());
              assert.equal(typeof nonce, "string");
              assert.ok(nonce.length > 0);
              ws.close();
              await once(ws, "close");
            } finally {
              await relay.close();
              clearTimeout(timeout);
            }
          '

  # The website builds with Astro on Linux; its tests check the built pages and the Worker.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @yorozu/web
      - run: pnpm --filter @yorozu/web build
      - name: Test website build and interactions
        run: pnpm --filter @yorozu/web test

  # One macOS runner for the TypeScript workspaces and the Swift packages: both need the same
  # install and build, and each runner boot costs more than the steps a pull request skips.
  macos:
    needs: changes
    if: needs.changes.outputs.internal != 'true' && (needs.changes.outputs.ts == 'true' || needs.changes.outputs.swift == 'true')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Swift wire tests run the phone client against the relay and sidecar built here.
      # Website build/tests belong to the Linux web job; no native suite consumes them.
      - run: pnpm --filter '!@yorozu/web' -r build
      - if: needs.changes.outputs.ts == 'true'
        run: pnpm --filter '!@yorozu/web' -r test
      # The hosted image's default Xcode can lag; this project needs the newest stable.
      - if: needs.changes.outputs.swift == 'true'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with: { xcode-version: latest-stable }
      # `swift test` already builds this package; a separate build compiled it twice.
      - if: needs.changes.outputs.swift == 'true'
        run: env -u SDKROOT swift test --package-path packages/shared-swift
      - if: needs.changes.outputs.swift == 'true'
        run: env -u SDKROOT swift test --package-path apps/mac
      - if: needs.changes.outputs.swift == 'true'
        run: bash scripts/check-mac-multi-host.sh

  internal-secretary:
    needs: changes
    if: needs.changes.outputs.internal == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with: { xcode-version: latest-stable }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26 }
      - name: Check the assembled production baseline and isolated Rust secretary
        # No legacy migration or recovery process is part of this candidate.
        run: ./scripts/check-internal-alpha.sh

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    env:
      YOROZU_SECRETARY_ENABLED: ${{ needs.changes.outputs.internal == 'true' && '1' || '0' }}
      TUIST_SECRETARY_ENABLED: ${{ needs.changes.outputs.internal == 'true' && 'true' || 'false' }}
    # PR CI compiles the app; the canonical Release requires the separate iOS UI-test
    # workflow before either candidate is built or uploaded.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The hosted image's default Xcode can lag; this project needs the newest stable.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with: { xcode-version: latest-stable }
      # The Xcode project is generated, not checked in; see apps/ios/Project.swift.
      # Homebrew has no versioned Tuist cask; use the same mise pin as TestFlight.
      - name: Install Tuist 4.209.0
        env:
          # mise's aqua backend reads GitHub's releases API; the token keeps shared runner
          # IPs clear of the anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          command -v mise >/dev/null || brew install mise
          mise use -g tuist@4.209.0
          mise bin-paths tuist@4.209.0 >> "$GITHUB_PATH"
      - run: tuist generate --no-open --path apps/ios
      - run: |
          xcodebuild build \
            -workspace apps/ios/Yorozu.xcworkspace \
            -scheme YorozuIOS \
            -skipPackagePluginValidation \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/ci-ios \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO SWIFT_EMIT_LOC_STRINGS=YES
      - name: Verify internal interface in the built app
        if: needs.changes.outputs.internal == 'true'
        run: test "$(/usr/libexec/PlistBuddy -c 'Print :YorozuSecretaryEnabled' .build/ci-ios/Build/Products/Debug-iphonesimulator/YorozuIOS.app/Info.plist)" = true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Verify compiled UI keys have English and Japanese coverage
        run: |
          extracted=.build/ci-ios/Build/Intermediates.noindex
          shared="$extracted/YorozuShared.build/Debug-iphonesimulator/YorozuShared.build/Objects-normal/arm64"
          # Xcode 27 adds a target suffix; Xcode 26 uses the package target's name.
          if [ ! -d "$shared" ]; then
            shared="$extracted/YorozuShared.build/Debug-iphonesimulator/YorozuShared-t.build/Objects-normal/arm64"
          fi
          node scripts/check-localizations.mjs apps/ios/Resources/Localizable.xcstrings "$shared"
          node scripts/check-localizations.mjs apps/mac/Resources/Localizable.xcstrings "$shared"
          for target in YorozuIOS YorozuShare YorozuWidget YorozuNotificationService; do
            node scripts/check-localizations.mjs apps/ios/Resources/Localizable.xcstrings \
              "$extracted/Yorozu.build/Debug-iphonesimulator/$target.build/Objects-normal/arm64"
          done
          node scripts/check-localizations.mjs apps/ios/Resources/YorozuWatch/Localizable.xcstrings \
            "$extracted/Yorozu.build/Debug-watchsimulator/YorozuWatch.build/Objects-normal/arm64"
