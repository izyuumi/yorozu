name: CI
on:
  push:
    branches: [main]
  pull_request:

# One run per ref: a newer push cancels the one it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GitHub-hosted runners only: this repo is public, and a self-hosted runner would run any fork's
# pull request on the maintainer's Mac.

# The token needs only to check out; nothing here writes back to GitHub.
permissions:
  contents: read

jobs:
  node:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The hosted image's default Xcode can lag; this project needs the newest stable.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with: { xcode-version: latest-stable }
      # `swift test` already builds this package; a separate build compiled it twice.
      - run: env -u SDKROOT swift test --package-path packages/shared-swift
      - run: env -u SDKROOT swift test --package-path apps/mac

  ios:
    runs-on: macos-latest
    # Simulator UI tests can hang on a hosted runner; fail instead of holding a slot for hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The hosted image's default Xcode can lag; this project needs the newest stable.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with: { xcode-version: latest-stable }
      # The Xcode project is generated, not checked in; see apps/ios/Project.swift.
      - run: command -v tuist >/dev/null || brew install --cask tuist
      - run: tuist generate --no-open --path apps/ios
      - run: |
          xcodebuild build \
            -workspace apps/ios/Yorozu.xcworkspace \
            -scheme YorozuIOS \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO
      - name: Composer keyboard interactions
        run: |
          # The test drives the software keyboard; a connected hardware keyboard hides it.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          # One device at a time. Given both destinations at once, xcodebuild boots both
          # simulators up front and leaves them running; on the hosted VM that starved the
          # first to the point where its test runner was killed before it ever connected,
          # and made the second's tests ten times slower than usual. Booting outside the
          # test clock keeps a slow boot from eating the test's own timeouts.
          for name in 'iPhone 17 Pro' 'iPad Pro 11-inch (M5)'; do
            xcrun simctl shutdown all
            xcrun simctl boot "$name" || true
            xcrun simctl bootstatus "$name" -b
            env -u SDKROOT xcodebuild test \
              -workspace apps/ios/Yorozu.xcworkspace \
              -scheme YorozuKeyboardUITests \
              -destination "platform=iOS Simulator,name=$name" \
              -resultBundlePath "$RUNNER_TEMP/keyboard-ui/$name.xcresult" \
              CODE_SIGNING_ALLOWED=NO
          done
      # The log alone named no assertion when this failed; the result bundle does.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: keyboard-ui-xcresult, path: "${{ runner.temp }}/keyboard-ui" }
