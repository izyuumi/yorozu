name: CI
on: [push, pull_request]

jobs:
  node:
    runs-on: [self-hosted, macOS, ARM64, yorozu]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test

  swift:
    runs-on: [self-hosted, macOS, ARM64, yorozu]
    steps:
      - uses: actions/checkout@v4
      # `swift test` already builds this package; a separate build compiled it twice.
      - run: env -u SDKROOT swift test --package-path packages/shared-swift
      - run: env -u SDKROOT swift test --package-path apps/mac

  ios:
    runs-on: [self-hosted, macOS, ARM64, yorozu]
    steps:
      - uses: actions/checkout@v4
      # The Xcode project is generated, not checked in; see apps/ios/Project.swift.
      - run: command -v tuist >/dev/null || brew install --cask tuist
      - run: tuist generate --no-open --path apps/ios
      - run: |
          xcodebuild build \
            -workspace apps/ios/Yorozu.xcworkspace \
            -scheme YorozuIOS \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO
      - name: Composer keyboard interactions
        run: |
          env -u SDKROOT xcodebuild test \
            -workspace apps/ios/Yorozu.xcworkspace \
            -scheme YorozuKeyboardUITests \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -destination 'platform=iOS Simulator,name=iPad Pro 11-inch (M5)' \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
