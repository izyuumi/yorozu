name: Checks
# Pull request checks (OWNER_DECISIONS.md, Process): the client compiles for iPhone and iPad and for the Mac, unsigned,
# and the relay passes its typecheck and tests. Each job runs only when its files changed; a skipped job counts as passed,
# so both can be required checks. No Swift tests or lint yet.
on:
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
      relay: ${{ steps.diff.outputs.relay }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE" HEAD)
          match() { printf '%s\n' "$files" | grep -qE "$1" && echo true || echo false; }
          echo "app=$(match '^(apps/ios/|packages/|plugins/|version\.txt$|\.github/workflows/checks\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "relay=$(match '^(apps/relay/|pnpm-lock\.yaml$|\.github/workflows/checks\.yml$)')" >> "$GITHUB_OUTPUT"

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with: { xcode-version: '27.1' } # the Xcode the owner builds with; the code needs the iOS 27 SDK
      - name: Install Tuist 4.209.0
        run: |
          command -v mise >/dev/null || brew install mise
          mise use -g tuist@4.209.0
          mise bin-paths tuist@4.209.0 >> "$GITHUB_PATH"
      - run: tuist generate --no-open --path apps/ios
      # The compile checks in docs/release.md.
      - name: iPhone and iPad
        run: |
          env -u SDKROOT xcodebuild build -workspace apps/ios/Yorozu.xcworkspace -scheme YorozuIOS \
            -destination 'generic/platform=iOS' -derivedDataPath .build/xcode-ios \
            -clonedSourcePackagesDirPath .build/xcode-packages -skipPackagePluginValidation -quiet \
            CODE_SIGNING_ALLOWED=NO
      - name: Mac
        run: |
          env -u SDKROOT xcodebuild build -workspace apps/ios/Yorozu.xcworkspace -scheme YorozuIOS \
            -destination 'platform=macOS' -derivedDataPath .build/xcode-mac \
            -clonedSourcePackagesDirPath .build/xcode-packages -skipPackagePluginValidation -quiet \
            CODE_SIGNING_ALLOWED=NO

  relay:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @yorozu/relay
      - run: pnpm --filter @yorozu/relay test
