name: Checks
on:
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
      relay: ${{ steps.diff.outputs.relay }}
      mcp: ${{ steps.diff.outputs.mcp }}
      web: ${{ steps.diff.outputs.web }}
      plugin: ${{ steps.diff.outputs.plugin }}
      windows_core: ${{ steps.diff.outputs.windows_core }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE" HEAD)
          match() { printf '%s\n' "$files" | grep -qE "$1" && echo true || echo false; }
          echo "app=$(match '^(apps/ios/|packages/|plugins/|\.github/workflows/checks\.yml$)')" >> "$GITHUB_OUTPUT"
          # The relay's tests also run the plugin's direct path end to end (src/direct.test.ts).
          echo "relay=$(match '^(apps/relay/|apps/ios/Tests/Fixtures/|plugins/openclaw-yorozu/src/|pnpm-lock\.yaml$|\.github/workflows/checks\.yml$)')" >> "$GITHUB_OUTPUT"
          # The help MCP bundle is generated from these (not CHANGELOG.md: the release PR changes only that).
          echo "mcp=$(match '^(apps/mcp/|apps/ios/|plugins/openclaw-yorozu/|docs/|README\.md$|apps/web/worker\.mjs$|pnpm-lock\.yaml$|\.github/workflows/checks\.yml$)')" >> "$GITHUB_OUTPUT"
          # The website's Worker serves the help MCP server, so its tests run for both.
          echo "web=$(match '^(apps/web/|apps/mcp/|pnpm-lock\.yaml$|\.github/workflows/checks\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "plugin=$(match '^(plugins/openclaw-yorozu/|apps/ios/Tests/Fixtures/|\.github/workflows/checks\.yml$)')" >> "$GITHUB_OUTPUT"
          # The Windows client's Rust core and its conformance test against the real Node relay; later
          # the shared wire fixtures and the plugin Hub too.
          echo "windows_core=$(match '^(apps/windows/|packages/YorozuWire/Tests/YorozuWireTests/Fixtures/|plugins/openclaw-yorozu/src/|apps/relay/src/|apps/relay/package\.json$|pnpm-lock\.yaml$|\.github/workflows/checks\.yml$)')" >> "$GITHUB_OUTPUT"

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with: { xcode-version: '27.1' }
      - name: Install Tuist (mise.toml)
        run: |
          command -v mise >/dev/null || brew install mise
          tuist=$(sed -n 's/^tuist = "\(.*\)"/\1/p' mise.toml)
          mise use -g "tuist@$tuist"
          mise bin-paths "tuist@$tuist" >> "$GITHUB_PATH"
      - run: tuist generate --no-open --path apps/ios
      - name: iPhone and iPad
        run: |
          env -u SDKROOT xcodebuild build -workspace apps/ios/Yorozu.xcworkspace -scheme YorozuIOS \
            -destination 'generic/platform=iOS' -derivedDataPath .build/xcode-ios \
            -clonedSourcePackagesDirPath .build/xcode-packages -skipPackagePluginValidation -quiet \
            CODE_SIGNING_ALLOWED=NO
      - name: Mac
        run: |
          env -u SDKROOT xcodebuild build -workspace apps/ios/Yorozu.xcworkspace -scheme YorozuIOS \
            -destination 'platform=macOS' -derivedDataPath .build/xcode-mac \
            -clonedSourcePackagesDirPath .build/xcode-packages -skipPackagePluginValidation -quiet \
            CODE_SIGNING_ALLOWED=NO
      - name: Unit tests
        run: |
          env -u SDKROOT xcodebuild test -workspace apps/ios/Yorozu.xcworkspace -scheme YorozuTests \
            -destination 'platform=macOS' -derivedDataPath .build/xcode-tests \
            -clonedSourcePackagesDirPath .build/xcode-packages -skipPackagePluginValidation -quiet \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
      - name: Voice package tests
        run: env -u SDKROOT swift test --package-path packages/YorozuVoice --scratch-path .build/voice
      - name: Wire package tests
        run: env -u SDKROOT swift test --package-path packages/YorozuWire --scratch-path .build/wire

  # The plugin's pure files' tests import only node built-ins, so they run without OpenClaw or an install.
  plugin:
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: node --test 'plugins/openclaw-yorozu/test/*.test.ts'

  # Every external TestFlight or Beta App Review path must pass the kill switch (scripts/external_testflight.sh).
  release-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - run: scripts/external_testflight.sh --audit
      - run: scripts/app_store_metadata.sh --check
      - run: scripts/release_notes_test.sh
      - name: Windows commit types
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        # HEAD is the merge ref, so its first parent is the base it was built on; base.sha can be older.
        run: BASE=$(git rev-parse HEAD^1) bash apps/windows/ci/commit-type.sh

  relay:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @yorozu/relay
      - run: pnpm --filter @yorozu/relay test

  mcp:
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @yorozu/help-mcp
      - run: pnpm --filter @yorozu/help-mcp check
      - run: pnpm --filter @yorozu/help-mcp typecheck
      - run: pnpm --filter @yorozu/help-mcp test

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@yorozu/web..."
      - run: pnpm --filter @yorozu/web build
      - run: pnpm --filter @yorozu/web test

  # The Windows client's Rust core (apps/windows/core): format, lint and tests.
  windows-core:
    needs: changes
    if: needs.changes.outputs.windows_core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      # actions/cache, not Swatinem/rust-cache: the repository allows only GitHub-owned, verified and listed actions.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/windows/target
          key: windows-core-${{ runner.os }}-${{ hashFiles('apps/windows/Cargo.lock', 'apps/windows/rust-toolchain.toml') }}
          restore-keys: windows-core-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile --filter @yorozu/relay
      - run: bash apps/windows/ci/core.sh
