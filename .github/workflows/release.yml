name: Release
# One Mac/candidate identity per run; iOS allocates within its marketing version.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, 'release/*']
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Source branch (main or release/X.Y); successful CI required'
        default: main
        required: true
        type: string
      version:
        description: 'Optional X.Y.Z override; otherwise release-as in source release-please-config.json'
        required: false
        type: string

# Superseded pending beta builds may be skipped; never interrupt signing/upload mid-run.
concurrency:
  group: candidate
  cancel-in-progress: false
permissions: {}

jobs:
  source:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch || inputs.source_branch }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Pin trusted source
        id: resolve
        run: |
          set -eu
          python3 - <<'PY_SOURCE'
          import os, re
          assert re.fullmatch(r"main|release/[0-9]+\.[0-9]+", os.environ["SOURCE_BRANCH"]), "use main or release/X.Y"
          assert os.environ["GITHUB_RUN_ATTEMPT"] == "1", "dispatch a fresh Release run to rebuild; use Promote for publication retries"
          PY_SOURCE
          if [ -z "$SOURCE_SHA" ]; then
            SOURCE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$SOURCE_BRANCH" --jq .object.sha)
          fi
          printf 'sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  # Nothing is signed or uploaded until the iOS UI tests have passed on the source commit,
  # here or in an earlier run.
  ui-tests:
    needs: source
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
      checks: read
    uses: ./.github/workflows/ui-tests.yml
    with:
      ref: ${{ needs.source.outputs.sha }}

  candidate:
    needs: [source, ui-tests]
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: macos-latest
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLIC: ${{ github.repository }}
      SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch || inputs.source_branch }}
      REQUESTED_VERSION: ${{ inputs.version }}
      ASC_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
      - name: Verify CI and allocate candidate
        id: candidate
        env:
          CANDIDATE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -eu
          CI_RUN_ID=$(python3 scripts/release.py check-ci --source "$CANDIDATE_SHA" --branch "$SOURCE_BRANCH")
          set -- --source "$CANDIDATE_SHA" --branch "$SOURCE_BRANCH" \
            --run-number "$GITHUB_RUN_NUMBER" --run-id "$GITHUB_RUN_ID" --ci-run-id "$CI_RUN_ID"
          if [ -n "$REQUESTED_VERSION" ]; then set -- "$@" --version "$REQUESTED_VERSION"; fi
          python3 scripts/release.py prepare "$@" --output dist/candidate.json
          python3 - <<'PY_METADATA'
          import json, os
          candidate = json.load(open("dist/candidate.json"))
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for key, field in [("VERSION", "version"), ("BUILD", "build"), ("CANDIDATE_TAG", "tag")]:
                  print(f"{key}={candidate[field]}", file=output)
          PY_METADATA
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with: { xcode-version: latest-stable }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Secrets are written only to $RUNNER_TEMP and a keychain of this job's own, both gone
      # with the VM. Never `set -x` here: the values would land in the log.
      - name: Signing identity and notary credentials
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -eu
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          : "${DEVELOPER_ID_P12:?set the DEVELOPER_ID_P12 secret; see the top of this file}"
          printf '%s' "$DEVELOPER_ID_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$DEVELOPER_ID_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          printf '%s' "$MAC_CERT_P12" | base64 -d > "$RUNNER_TEMP/ios-cert.p12"
          security import "$RUNNER_TEMP/ios-cert.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/ios-cert.p12"
          # A Developer ID certificate is only an identity codesign will use if its chain
          # validates, and a fresh runner has no Apple intermediates. Both are public.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          # A .p12 exported from Keychain Access can carry part of the chain already, and
          # `security import` treats a duplicate as an error.
          for ca in DeveloperIDG2CA AppleWWDRCAG3; do
            security import "$RUNNER_TEMP/$ca.cer" -t cert -k "$KEYCHAIN" 2>&1 | grep -v 'already exists' || true
          done
          # codesign and notarytool read this keychain without a dialog nobody is there to click.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          # Names and fingerprints only, nothing secret: this is what codesign will be able to find.
          security find-identity -v -p codesigning "$KEYCHAIN"
          # Fail here, not after a long build, if the .p12 was the wrong identity.
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "DEVELOPER_ID_P12 holds no Developer ID Application identity" >&2; exit 1; }
          # The profile build-mac.sh looks for, stored in the default keychain set just above.
          printf '%s' "$ASC_KEY_P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials yorozu-notary \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"

      - name: Prepare Sparkle key
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          set -eu
          : "${SPARKLE_ED_KEY:?SPARKLE_ED_KEY secret is empty}"
          umask 077
          printf '%s' "$SPARKLE_ED_KEY" > "$RUNNER_TEMP/sparkle.key"

      - name: Install Tuist 4.209.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          command -v mise >/dev/null || brew install mise
          mise use -g tuist@4.209.0
          mise bin-paths tuist@4.209.0 >> "$GITHUB_PATH"
      - name: Build signed and notarized Mac candidate
        env:
          SPARKLE_ED_KEY_FILE: ${{ runner.temp }}/sparkle.key
        run: |
          set -eu
          ./scripts/build-mac.sh
          CHANNEL=beta DOWNLOAD_PREFIX="https://github.com/$GITHUB_REPOSITORY/releases/download/$CANDIDATE_TAG/" \
            ./scripts/appcast.sh
          shasum -a 256 dist/Yorozu.dmg dist/appcast.xml > dist/mac-sha256.txt
      - name: Install App Store Connect CLI 5.9.0
        run: |
          set -eu
          case "$(uname -m)" in
            arm64) arch=arm64; checksum=6d46e477c565d45972decbde84d055eb028874a1c8322a450355b98b629ba382 ;;
            x86_64) arch=amd64; checksum=c293cdce9c4b9e0d6e0627a26cabf6843cfe93f28a1c69ffa49bca5d849a0691 ;;
            *) echo 'unsupported ASC CLI architecture' >&2; exit 1 ;;
          esac
          directory="$RUNNER_TEMP/asc-cli"
          asset="asc_5.9.0_macOS_$arch"
          gh release download 5.9.0 --repo rorkai/App-Store-Connect-CLI --pattern "$asset" --dir "$directory"
          printf '%s  %s\n' "$checksum" "$directory/$asset" | shasum -a 256 -c -
          mv "$directory/$asset" "$directory/asc"
          chmod 755 "$directory/asc"
          "$directory/asc" --version
          echo "$directory" >> "$GITHUB_PATH"
      - name: Upload and identify the iOS candidate
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          ASC_PRIVATE_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          ASC_BYPASS_KEYCHAIN: '1'
        run: |
          set -eu
          IOS_BUILD=$(node scripts/asc-candidate.mjs next-build "$VERSION")
          BUILD="$IOS_BUILD" ./scripts/build-ios.sh
          deadline=$((SECONDS + 1800))
          selector=(--app 6811274963 --build-number "$IOS_BUILD" --version "$VERSION" --platform IOS)
          while :; do
            remaining=$((deadline - SECONDS))
            [ "$remaining" -gt 0 ] || { echo 'iOS processing is pending; resume the retained receipt, do not reupload' >&2; exit 7; }
            window=50
            [ "$remaining" -ge "$window" ] || window=$remaining
            status=0
            asc --read-only builds wait "${selector[@]}" --timeout "${window}s" \
              --report-pending --fail-on-invalid --output json > dist/ios-processing.json || status=$?
            if [ "$status" -eq 7 ]; then
              cp dist/ios-processing.json dist/ios-processing-pending.json
              cat dist/ios-processing-pending.json
              known_id=$(python3 -c 'import json; print(json.load(open("dist/ios-processing-pending.json")).get("buildId", ""))')
              [ -z "$known_id" ] || selector=(--build-id "$known_id")
              continue
            fi
            [ "$status" -eq 0 ] || exit "$status"
            break
          done
          node scripts/asc-candidate.mjs resolve "$VERSION" "$IOS_BUILD" dist/ios.json
          BUILD_ID=$(python3 - <<'PY_BUILD_ID'
          import json
          receipt = json.load(open('dist/ios-processing.json'))
          ios = json.load(open('dist/ios.json'))
          assert receipt['buildId'] == ios['build_id'], 'processing receipt belongs to a different build'
          print(ios['build_id'])
          PY_BUILD_ID
          )
          asc --read-only builds test-notes list --build-id "$BUILD_ID" --output json > dist/ios-test-notes-before.json
          notes_action=$(python3 - <<'PY_NOTES'
          import json
          notes = next((note['attributes'] for note in json.load(open('dist/ios-test-notes-before.json'))['data']
                        if note['attributes']['locale'] == 'en-US'), None)
          print('keep' if notes and (notes.get('whatsNew') or '').strip() else 'update' if notes else 'create')
          PY_NOTES
          )
          if [ "$notes_action" = keep ]; then
            cp dist/ios-test-notes-before.json dist/ios-test-notes.json
          else
            asc builds test-notes "$notes_action" --build-id "$BUILD_ID" --locale en-US \
              --whats-new 'Please test pairing, reconnection, streamed replies, tool approvals, and reply layout at normal and accessibility text sizes.' \
              --output json > dist/ios-test-notes.json
          fi
          asc --read-only validate testflight --app 6811274963 --build-id "$BUILD_ID" \
            --output json > dist/ios-testflight-validation.json
          node scripts/asc-candidate.mjs distribute dist/ios.json
      - name: Publish candidate
        run: |
          set -eu
          python3 scripts/release.py candidate --manifest dist/candidate.json --ios dist/ios.json --dist dist
          printf 'Candidate: [%s](https://github.com/%s/releases/tag/%s)\n' \
            "$CANDIDATE_TAG" "$GITHUB_REPOSITORY" "$CANDIDATE_TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain processing receipts and signed candidate on failure
        if: failure() && hashFiles('dist/mac-sha256.txt') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-processing
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/candidate.json
            dist/Yorozu.dmg
            dist/appcast.xml
            dist/mac-sha256.txt
            dist/export/*.ipa
            dist/ios-sha256.txt
            dist/asc-version.txt
            dist/ios-upload.json
            dist/ios.json
            dist/ios-processing*.json
            dist/ios-test-notes.json
            dist/ios-test-notes-before.json
            dist/ios-testflight-validation.json
      - name: Forget signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/sparkle.key" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/ios-cert.p12"
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
