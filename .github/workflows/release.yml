name: Release
# Cut a Mac release from a v* tag (TestFlight builds go from every push to main; see
# testflight.yml): scripts/release.sh on a hosted runner, with the signing
# identity, the notary key and the Sparkle key coming from repository secrets. Only a push to
# this repo triggers it — never a fork's pull request — so secrets are never in a stranger's job.
on:
  push:
    tags: ['v*']
  # Rerun for a tag that already exists: gh workflow run release.yml --ref v0.2.2
  workflow_dispatch:

concurrency: release

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The version is the latest v* tag and the build number the commit count; both need
          # the whole history.
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with: { xcode-version: latest-stable }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Secrets are written only to $RUNNER_TEMP and a keychain of this job's own, both gone
      # with the VM. Never `set -x` here: the values would land in the log.
      - name: Signing identity and notary credentials
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -eu
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MAC_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
          # A Developer ID certificate is only an identity codesign will use if its chain
          # validates, and a fresh runner has no Apple intermediates. Both are public.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          # A .p12 exported from Keychain Access can carry part of the chain already, and
          # `security import` treats a duplicate as an error.
          for ca in DeveloperIDG2CA AppleWWDRCAG3; do
            security import "$RUNNER_TEMP/$ca.cer" -t cert -k "$KEYCHAIN" 2>&1 | grep -v 'already exists' || true
          done
          # codesign and notarytool read this keychain without a dialog nobody is there to click.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          # Names and fingerprints only, nothing secret: this is what codesign will be able to find.
          security find-identity -v -p codesigning "$KEYCHAIN"
          # The profile build-mac.sh looks for, stored in the default keychain set just above.
          printf '%s' "$ASC_KEY_P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials yorozu-notary \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
          rm "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, notarize, sign the appcast, publish
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          set -eu
          umask 077
          printf '%s' "$SPARKLE_ED_KEY" > "$RUNNER_TEMP/sparkle.key"
          SPARKLE_ED_KEY_FILE="$RUNNER_TEMP/sparkle.key" ./scripts/release.sh

      - name: Forget the secrets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/sparkle.key" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
