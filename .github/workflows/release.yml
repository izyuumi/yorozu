name: Release
on:
  push:
    tags: ["v*"]

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The Developer ID identity and the Sparkle private key are per-machine; CI gets
      # them from secrets into a throwaway keychain that dies with the runner.
      - name: Import signing identity
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERTIFICATE_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" \
            build.keychain
          rm /tmp/cert.p12

      - name: Store notarization credentials
        env:
          ASC_KEY: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          echo "$ASC_KEY" | base64 --decode > /tmp/key.p8
          xcrun notarytool store-credentials yorozu-notary \
            --key /tmp/key.p8 --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
          rm /tmp/key.p8

      - name: Build, sign, notarize
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/build-mac.sh

      - name: Generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY" | security import /dev/stdin -k build.keychain || true
          ./scripts/appcast.sh

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/appcast.xml
