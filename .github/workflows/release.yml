name: Release
# Release Please opens version PRs; merging one builds a Mac release (TestFlight
# builds go from every push to main; see
# testflight.yml): scripts/release.sh on a hosted runner, with the signing identity, the
# notary key and the Sparkle key coming from repository secrets. Only a push to this repo
# triggers it — never a fork's pull request — so secrets are never in a stranger's job.
#
# DEVELOPER_ID_P12 is the "Developer ID Application" identity with its private key, exported
# from the maintainer's login keychain, base64; DEVELOPER_ID_PASSWORD is the .p12 password.
# (MAC_CERT_P12 holds the Apple Development identity the TestFlight archive needs; it does
# not carry Developer ID, which is why this job has a secret of its own.) To refresh:
#   security export -k ~/Library/Keychains/login.keychain-db -t identities -f pkcs12 \
#     -P "$PW" -o developer-id.p12      # click Allow in the keychain dialog
#   base64 -i developer-id.p12 | gh secret set DEVELOPER_ID_P12
#   gh secret set DEVELOPER_ID_PASSWORD --body "$PW" && rm developer-id.p12
on:
  push:
    branches: [main]
  # Retry a failed build with the current workflow and the original source tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (for example v0.2.2)'
        required: true
        type: string

concurrency: release

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  mac:
    needs: release-please
    # GITHUB_TOKEN-created tags do not trigger another workflow. Build here instead.
    if: >-
      always() && !cancelled() &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The version is the latest v* tag and the build number the commit count; both need
          # the whole history.
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - name: Check out release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: .release-tooling
      - name: Use current publication script
        run: cp .release-tooling/scripts/release.sh scripts/release.sh
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with: { xcode-version: latest-stable }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Secrets are written only to $RUNNER_TEMP and a keychain of this job's own, both gone
      # with the VM. Never `set -x` here: the values would land in the log.
      - name: Signing identity and notary credentials
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -eu
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          : "${DEVELOPER_ID_P12:?set the DEVELOPER_ID_P12 secret; see the top of this file}"
          printf '%s' "$DEVELOPER_ID_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$DEVELOPER_ID_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
          # A Developer ID certificate is only an identity codesign will use if its chain
          # validates, and a fresh runner has no Apple intermediates. Both are public.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          # A .p12 exported from Keychain Access can carry part of the chain already, and
          # `security import` treats a duplicate as an error.
          for ca in DeveloperIDG2CA AppleWWDRCAG3; do
            security import "$RUNNER_TEMP/$ca.cer" -t cert -k "$KEYCHAIN" 2>&1 | grep -v 'already exists' || true
          done
          # codesign and notarytool read this keychain without a dialog nobody is there to click.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          # Names and fingerprints only, nothing secret: this is what codesign will be able to find.
          security find-identity -v -p codesigning "$KEYCHAIN"
          # Fail here, not after a long build, if the .p12 was the wrong identity.
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "DEVELOPER_ID_P12 holds no Developer ID Application identity" >&2; exit 1; }
          # The profile build-mac.sh looks for, stored in the default keychain set just above.
          printf '%s' "$ASC_KEY_P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials yorozu-notary \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
          rm "$RUNNER_TEMP/AuthKey.p8"

      - name: Prepare Sparkle key
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          set -eu
          : "${SPARKLE_ED_KEY:?SPARKLE_ED_KEY secret is empty}"
          umask 077
          printf '%s' "$SPARKLE_ED_KEY" > "$RUNNER_TEMP/sparkle.key"

      - name: Build, notarize, sign the appcast, publish
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_KEY_FILE: ${{ runner.temp }}/sparkle.key
        run: ./scripts/release.sh

      - name: Forget the secrets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/sparkle.key" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
