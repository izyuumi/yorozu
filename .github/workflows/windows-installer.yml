name: Windows installer

# Builds, tests and installs the Windows app, then uploads the unsigned NSIS installer.
# apps/windows/README.md says how to download it.
on:
  pull_request:
    paths: ['apps/windows/**', '.github/workflows/windows-installer.yml']
  push:
    branches: [main]
    paths: ['apps/windows/**', '.github/workflows/windows-installer.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull request runs cancel each other; every commit on main gets its own run.
  group: windows-installer-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/windows/app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: apps/windows/app/pnpm-lock.yaml
      # actions/cache, not Swatinem/rust-cache: the repository allows only GitHub-owned, verified and listed actions.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/windows/target
          key: windows-installer-${{ runner.os }}-${{ hashFiles('apps/windows/Cargo.lock', 'apps/windows/rust-toolchain.toml') }}
          restore-keys: windows-installer-${{ runner.os }}-
      - shell: pwsh
        run: ./apps/windows/ci/app.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yorozu-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/windows/target/release/bundle/nsis/Yorozu_0.1.0_x64-setup.exe
          if-no-files-found: error
          retention-days: 90
