name: Windows installer

on:
  pull_request:
    paths: ['apps/windows/**', '.github/workflows/windows-installer.yml', 'scripts/version.sh']
  push:
    branches: [main]
    paths: ['apps/windows/**', '.github/workflows/windows-installer.yml', 'scripts/version.sh']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  installer:
    if: github.event_name != 'release'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/windows/app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: apps/windows/app/pnpm-lock.yaml
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/windows/target
          key: windows-installer-${{ runner.os }}-${{ hashFiles('apps/windows/Cargo.lock', 'apps/windows/rust-toolchain.toml') }}
          restore-keys: windows-installer-${{ runner.os }}-
      - name: Checked-in Windows version vs the latest stable release
        shell: bash
        run: |
          warn() { m=${1//'%'/%25}; m=${m//$'\r'/%0D}; echo "::warning title=Windows version::${m//$'\n'/%0A}"; }
          if ! stable=$(bash apps/windows/ci/version.sh stable 2>&1); then
            warn "$stable"
          elif ! out=$(bash apps/windows/ci/version.sh check "$stable" 2>&1); then
            warn "$out"
          fi
          exit 0
      - name: Stamp the shared version
        id: version
        shell: bash
        run: |
          v=$(bash apps/windows/ci/version.sh shared)
          bash apps/windows/ci/version.sh set "$v"
          bash apps/windows/ci/version.sh check "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "YOROZU_VERSION=$v" >> "$GITHUB_ENV" # app.ps1 expects the built app to carry it
          echo "shared version: $v"
      - shell: pwsh
        run: ./apps/windows/ci/app.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yorozu-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/windows/target/release/bundle/nsis/Yorozu_${{ steps.version.outputs.version }}_x64-setup.exe
          if-no-files-found: error
          retention-days: 90

  attach-beta-test:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test attach-beta.sh
        run: bash apps/windows/ci/attach-beta.test.sh

  attach-beta:
    needs: [installer, attach-beta-test]
    if: >
      always() &&
      (
        (
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
          && needs.installer.result == 'success'
          && needs.attach-beta-test.result == 'success'
        ) ||
        (
          github.event_name == 'release' &&
          github.event.release.prerelease &&
          needs.installer.result == 'skipped'
          && needs.attach-beta-test.result == 'skipped'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: windows-beta-attach
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Attach the unsigned Windows installer to the matching beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = release ]; then
            sha=$(gh api "repos/$REPO/commits/$TAG_NAME" --jq .sha)
            bash apps/windows/ci/attach-beta.sh --tag "$TAG_NAME" --artifact-sha "$sha" --append-notes
          else
            v=$(bash apps/windows/ci/version.sh shared)
            bash apps/windows/ci/attach-beta.sh --tag "v${v}-beta" --artifact-sha "$GITHUB_SHA" --append-notes
          fi
