name: Windows installer

on:
  pull_request:
    paths: ['apps/windows/**', '.github/workflows/windows-installer.yml', 'scripts/version.sh']
  push:
    branches: [main]
    paths: ['apps/windows/**', '.github/workflows/windows-installer.yml', 'scripts/version.sh']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/windows/app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: apps/windows/app/pnpm-lock.yaml
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/windows/target
          key: windows-installer-${{ runner.os }}-${{ hashFiles('apps/windows/Cargo.lock', 'apps/windows/rust-toolchain.toml') }}
          restore-keys: windows-installer-${{ runner.os }}-
      - name: Checked-in Windows version vs the latest stable release
        shell: bash
        run: |
          warn() { m=${1//'%'/%25}; m=${m//$'\r'/%0D}; echo "::warning title=Windows version::${m//$'\n'/%0A}"; }
          if ! stable=$(bash apps/windows/ci/version.sh stable 2>&1); then
            warn "$stable"
          elif ! out=$(bash apps/windows/ci/version.sh check "$stable" 2>&1); then
            warn "$out"
          fi
          exit 0
      - name: Stamp the shared version
        id: version
        shell: bash
        run: |
          v=$(bash apps/windows/ci/version.sh shared)
          bash apps/windows/ci/version.sh set "$v"
          bash apps/windows/ci/version.sh check "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "YOROZU_VERSION=$v" >> "$GITHUB_ENV" # app.ps1 expects the built app to carry it
          echo "shared version: $v"
      - shell: pwsh
        run: ./apps/windows/ci/app.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yorozu-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/windows/target/release/bundle/nsis/Yorozu_${{ steps.version.outputs.version }}_x64-setup.exe
          if-no-files-found: error
          retention-days: 90
      # Attest the uploaded Windows NSIS installer.
      - name: Attest the Windows installer
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: apps/windows/target/release/bundle/nsis/Yorozu_${{ steps.version.outputs.version }}_x64-setup.exe
      - name: Verify the installer attestation
        if: github.event_name != 'pull_request'
        shell: bash
        run: gh attestation verify "apps/windows/target/release/bundle/nsis/Yorozu_${{ steps.version.outputs.version }}_x64-setup.exe" --repo izyuumi/yorozu
        env:
          GH_TOKEN: ${{ github.token }}
