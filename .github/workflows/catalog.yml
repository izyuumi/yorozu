name: Catalog

# The catalog ships beside the app on the latest versioned release.
on:
  push:
    branches: [main]
    paths: ["catalog/**"]

concurrency: release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update catalog on the latest release
        run: |
          set -eu
          TAG=$(gh release view --json tagName --jq .tagName)
          gh release upload "$TAG" catalog/models.json --clobber
