name: Catalog

# The catalog ships beside the app on the latest versioned release.
on:
  push:
    branches: [main]
    paths: ["catalog/**"]

concurrency: release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Update catalog on the latest release
        run: |
          set -eu
          TAG=$(gh release view --json tagName --jq .tagName)
          gh release upload "$TAG" catalog/models.json --clobber
