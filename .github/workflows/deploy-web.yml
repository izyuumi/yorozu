name: Deploy website
on:
  push:
    branches: [main]
    # Only website changes deploy; a dependency bump that touches the site edits its package.json.
    paths: ['apps/web/**']
  workflow_dispatch:

# Deploys run in push order; a newer one never cancels a deploy midway.
concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @yorozu/web
      - run: pnpm --filter @yorozu/web build
      # The same checks as CI, so a broken build never reaches yorozu.yumi.to.
      - run: pnpm --filter @yorozu/web test
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @yorozu/web exec wrangler deploy
