name = "yorozu-relay"
main = "src/worker.ts"
# Match the workerd baseline bundled by our Vitest pool; config rejects unsupported dates.
compatibility_date = "2026-03-10"

# relay.yumi.to is a custom domain on the yumi.to zone: Cloudflare terminates TLS and
# `wss://relay.yumi.to` reaches the Worker directly, no route pattern needed.
[[routes]]
pattern = "relay.yumi.to"
custom_domain = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# New sockets per client address. A household behind one address redialling every host at once
# stays well under this; a redial loop does not.
[[ratelimits]]
name = "CONNECT_LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
