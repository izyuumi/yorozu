# Test fixture only; never deploy.
name = "yorozu-relay-v0130-test"
main = "src/worker.ts"
compatibility_date = "2026-03-10"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[ratelimits]]
name = "CONNECT_LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Mailbox"]
