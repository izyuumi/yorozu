[package]
name = "yorozu-windows"
description = "Yorozu for Windows"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[lib]
name = "yorozu_windows_lib"

[[bin]]
name = "yorozu"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
yorozu-core = { path = "../../core" }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-single-instance = "=2.5.5"

[dev-dependencies]
serde_json = "=1.0.154"
