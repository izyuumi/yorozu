[package]
name = "yorozu-core"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[features]
# Gates the test-only plaintext key store (PlainProtector). Stays off in the app.
insecure-plaintext-store = []

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
url = "=2.5.8"

snow = { version = "=0.10.0", default-features = false, features = ["risky-raw-split", "std", "use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom"] }
chacha20poly1305 = "=0.10.1"
ed25519-dalek = "=2.2.0"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
sha2 = "=0.10.9"
base64 = "=0.23.1"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
uuid = { version = "=1.29.2", features = ["v4"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12", "ring"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Storage_FileSystem"] }
