[package]
name = "yorozu-host-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10.1"
ed25519-dalek = "2.2"
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "yorozu-host-core"
path = "src/main.rs"

# Keep debug/overflow checks while reducing payload validation overhead
# in the development worker used by native fixtures. Release builds keep their own profile.
[profile.dev]
opt-level = 1
