[package]
name = "yorozu-host-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "yorozu-host-core"
path = "src/main.rs"
