[package]
name = "yorozu-computer-use"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
enigo = "=0.6.1"
screencapturekit = { version = "=11.0.0", features = ["macos_14_0"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "NSWorkspace"] }
core-graphics = "0.25"
core-foundation = "0.10"
png = "0.18"
